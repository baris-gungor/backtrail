services:
  postgres:
    image: postgres:16-alpine
    container_name: backtrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fin_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fin_agent}
      POSTGRES_DB: ${DB_NAME:-fin_agent}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${DB_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-fin_agent} -d ${DB_NAME:-fin_agent}']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: backtrail-pgadmin
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env to use pgAdmin}
    ports:
      - '127.0.0.1:5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
